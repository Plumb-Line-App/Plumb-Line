# Checks the live site in real Mobile Safari on an iPhone 17 simulator, plus a WebKit interaction suite.
# Run it from the Actions tab (or the API); results are pushed to the qa-results branch and kept as an artifact.
name: Safari QA (iPhone 17)

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to test (blank = this repo's GitHub Pages site)
        default: ''

permissions:
  contents: write

concurrency:
  group: safari-qa
  cancel-in-progress: true

jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # The repo's own Pages address, so the check follows the repo if it moves or is renamed.
      URL: ${{ inputs.url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the address answers (as given, and all lowercase)
        run: |
          mkdir -p results
          LOWER=$(echo "$URL" | tr '[:upper:]' '[:lower:]')
          for u in "$URL" "$LOWER"; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' -L "$u") $u" | tee -a results/address.txt
          done

      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          mkdir -p results

      - name: Boot an iPhone 17 simulator
        run: |
          read UDID IOS < <(python3 tests/safari/pick_sim.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "iPhone 17 · iOS $IOS · $UDID" | tee results/device.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Open Simulator.app and warm up Safari once, so the first link doesn't time out.
          open "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$UDID"
          sleep 20
          xcrun simctl launch "$UDID" com.apple.mobilesafari || true
          sleep 20

      - name: Screenshot each tab in Mobile Safari (light and dark)
        continue-on-error: true
        run: |
          mkdir -p results/safari
          open_url() {
            for i in 1 2 3; do
              xcrun simctl openurl "$UDID" "$1" && return 0
              echo "openurl attempt $i failed; retrying"
              sleep 15
            done
            return 1
          }
          for scheme in light dark; do
            xcrun simctl ui "$UDID" appearance "$scheme"
            for tab in today script progress foundations; do
              open_url "${URL}?qa=${scheme}-${tab}#${tab}" || continue
              sleep 10
              xcrun simctl io "$UDID" screenshot "results/safari/${scheme}-${tab}.png"
            done
          done
          xcrun simctl ui "$UDID" appearance light

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: WebKit interaction suite at 402×874
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@latest
          npx playwright install webkit
          BASE="$URL" OUT=results/webkit BROWSER=webkit node tests/safari/run.js 2>&1 | tee results/webkit.txt
          BASE="$URL" BROWSER=webkit node tests/safari/regress.js 2>&1 | tee results/webkit-regress.txt

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-qa
          path: results

      - name: Publish results to the qa-results branch
        if: always()
        run: |
          cd results
          git init -q -b qa-results
          git add -A
          git -c user.name="qa-bot" -c user.email="qa-bot@users.noreply.github.com" commit -q -m "Safari QA $(date -u +%FT%TZ) for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" qa-results
